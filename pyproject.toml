[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tujia-llm"
version = "0.2.0"
description = "Tujia language generation with a LoRA adapter on Qwen3-8B (MLX, Apple Silicon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ibaibing" }]
keywords = ["tujia", "low-resource", "language", "mlx", "lora"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "huggingface_hub>=0.24",
  "mlx-lm>=0.21; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/ibaibing/tujia-llm"
"Model (Hugging Face)" = "https://huggingface.co/TujiaNLP/tujia-llm-8b-v0.2"
"Model (ModelScope)" = "https://modelscope.cn/models/TujiaNLP/tujia-llm-8b-v0.2"

[project.scripts]
tujia-llm = "tujia_llm.cli:main"

[tool.setuptools.packages.find]
include = ["tujia_llm*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
